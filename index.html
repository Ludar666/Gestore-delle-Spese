<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>Spese Condivise</title>
<style>
:root{--g:#173f35;--g2:#2d6a5a;--bg:#f5f7f5;--card:#fff;--line:#e1e7e3;--muted:#71807b;--red:#b64242;--mint:#e8f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2825;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:82px}.top{padding:20px 16px 12px;background:#fff;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800;color:var(--g)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.content{padding:14px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 12px #173f350b}.label,.meta{font-size:12px;color:var(--muted)}.value{font-size:21px;font-weight:800;margin-top:4px}.section{font-size:17px;font-weight:800;margin:20px 2px 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.expense{padding:13px 0;border-bottom:1px solid var(--line)}.expense:last-child{border:0}.title{font-weight:700}.amount{font-weight:800;white-space:nowrap}.neg{color:var(--red)}.pos{color:#147050}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:750}.primary{background:var(--g);color:white}.secondary{background:var(--mint);color:var(--g)}.danger{background:#fceeee;color:var(--red);border:0;border-radius:8px;padding:5px}.full{width:100%}.balance{font-size:32px;font-weight:850;color:var(--g);margin:5px 0 12px}.hint{background:#f2f6f4;border-radius:11px;padding:10px;font-size:12px;color:var(--muted)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}.quickico{font-size:31px;line-height:1}.quickadd{color:#b64242}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:750;color:#52615c;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d6dfda;border-radius:10px;background:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.choices button.sel{border:2px solid var(--g);background:var(--mint);color:var(--g);font-weight:800}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.checks label.sel{border-color:var(--g);background:var(--mint)}.modalbg{position:fixed;inset:0;background:#0b201b77;z-index:20;display:flex;align-items:flex-end}.modal{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px;max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:10}.navin{max-width:760px;margin:auto;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#87938f;font-size:11px}.nav button.active{color:var(--g);font-weight:800}.ico{display:block;font-size:20px}.fab{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:12;border:0;background:var(--g);color:#fff;padding:13px 20px;border-radius:16px;font-weight:800;box-shadow:0 7px 22px #173f3540}.empty{text-align:center;padding:30px;color:#9aa5a1}.filterbar{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.filterbar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:12px}.filterbar button.sel{background:var(--mint);border-color:var(--g);color:var(--g);font-weight:800}.chart{width:100%;overflow:hidden}.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding:15px 4px 4px;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.bar{width:100%;max-width:32px;background:var(--g2);border-radius:7px 7px 2px 2px;min-height:3px}.barlabel{font-size:10px;color:var(--muted);margin-top:6px;text-align:center}.barvalue{font-size:9px;color:var(--muted);margin-bottom:3px}
 .linechart{position:relative;height:240px;padding:12px 4px 28px;overflow:hidden}.linegrid{position:absolute;inset:12px 4px 28px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 24%,var(--line) 24.5%,transparent 25%)}.lineSvg{position:absolute;left:4px;right:4px;top:12px;width:calc(100% - 8px);height:200px;overflow:visible}.lineLegend{position:relative;display:inline-flex;align-items:center;gap:6px;margin:0 8px 5px 0;font-size:11px;z-index:2}.legendDot{width:9px;height:9px;border-radius:50%;background:var(--lineColor1)}.lineLegend:nth-of-type(2) .legendDot{background:var(--lineColor2)}.lineLegend:nth-of-type(3) .legendDot{background:var(--lineColor3)}.lineLegend:nth-of-type(4) .legendDot{background:var(--lineColor4)}.lineLegend:nth-of-type(5) .legendDot{background:var(--lineColor5)}.lineLegend:nth-of-type(6) .legendDot{background:var(--lineColor6)}.lineLegend:nth-of-type(7) .legendDot{background:var(--lineColor7)}.lineLegend:nth-of-type(8) .legendDot{background:var(--lineColor8)}.lineLabels{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.quick button{min-height:100px;padding:14px 8px}.quickico{font-size:40px!important;line-height:1}.quickadd{color:#d33!important}.mainSvg{position:absolute;left:4px;right:4px;top:34px;width:calc(100% - 8px);height:170px;overflow:visible}.incomeLine,.expenseLine{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke}.incomeLine{stroke:#2e9d61}.expenseLine{stroke:#d34b4b}.incomePoint{fill:#2e9d61}.expensePoint{fill:#d34b4b}.chartLegend{position:relative;display:flex;gap:16px;justify-content:center;font-size:11px;z-index:2}.chartLegend span{display:flex;align-items:center;gap:5px}.chartLegend i{width:9px;height:9px;border-radius:50%;display:inline-block}.incomeDot{background:#2e9d61}.expenseDot{background:#d34b4b}.lineLabels{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.catbar{padding:9px 0}.bartrack{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}.barfill{height:100%;background:var(--mint);border-radius:5px}</style></head><body><div id="root"></div><script>
(function(){
var KEY='spese_condivise_v2';
var data=load(),view='home',modal=null,payer='',split='equal',paymentFrom='',moveWho='all',moveCat='all',chartPeriod='year',chartWho='all',chartCat='all';
function load(){var dflt={people:['Enrico','Claudia'],expenses:[],incomes:[],payments:[],categories:['Utenze','Spesa alimentare','Casa','Auto','Pasti fuori','Shopping','Viaggi','Spese Mediche','Svago','Regali','Mutuo','Altro']};try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||typeof d!=='object')return dflt;if(!Array.isArray(d.people)||d.people.length<2)d.people=dflt.people.slice();if(!Array.isArray(d.expenses))d.expenses=[];if(!Array.isArray(d.incomes))d.incomes=[];if(!Array.isArray(d.payments))d.payments=[];if(!Array.isArray(d.categories)||!d.categories.length)d.categories=dflt.categories.slice();return d}catch(e){return dflt}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function euro(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function total(){return data.expenses.reduce(function(a,e){return a+e.amount},0)}
function paid(p){return data.expenses.filter(function(e){return e.paidBy===p}).reduce(function(a,e){return a+e.amount},0)}
function share(e,p){if(e.participants.indexOf(p)<0)return 0;if(e.split==='equal')return e.amount/e.participants.length;return Number((e.shares||{})[p]||0)}
function net(p){var x=paid(p)-data.expenses.reduce(function(a,e){return a+share(e,p)},0);data.payments.forEach(function(q){if(q.to===p)x-=q.amount;if(q.from===p)x+=q.amount});return x}
function sentence(){var a=data.people[0],b=data.people[1],n=net(a);if(!b)return'Configura una seconda persona.';if(Math.abs(n)<.005)return'Siete in pari.';return n>0?b+' deve '+euro(n)+' a '+a:a+' deve '+euro(-n)+' a '+b}
function nav(){return'<button class="fab" onclick="openExpense()">＋ Nuova spesa</button><div class="nav"><div class="navin"><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="ico">⌂</span>Home</button><button class="'+(view==='moves'?'active':'')+'" onclick="go(\'moves\')"><span class="ico">☷</span>Movimenti</button><button class="'+(view==='chart'?'active':'')+'" onclick="go(\'chart\')"><span class="ico">▥</span>Grafico</button><button class="'+(view==='more'?'active':'')+'" onclick="go(\'more\')"><span class="ico">⚙</span>Impost.</button></div></div>'}
function top(){return'<div class="top"><div class="brand">Spese Condivise</div><div class="sub">Chi ha pagato · chi deve cosa · saldi</div></div>'}
function expRow(e){return'<div class="expense row"><div><div class="title">'+esc(e.desc||'Spesa')+'</div><div class="meta">'+fmtDate(e.date)+' · pagata da <b>'+esc(e.paidBy)+'</b></div><div class="meta">Divisa tra '+e.participants.map(esc).join(', ')+'</div></div><div style="text-align:right"><div class="amount neg">−'+euro(e.amount)+'</div><button class="danger" onclick="delExp('+e.id+')">Elimina</button></div></div>'}
function home(){var r=data.expenses.slice(0,6);return'<div class="content"><div class="grid"><div class="card"><div class="label">Spese totali</div><div class="value">'+euro(total())+'</div></div><div class="card"><div class="label">Pagate da '+esc(data.people[0])+'</div><div class="value">'+euro(paid(data.people[0]))+'</div></div></div><div class="card" style="margin-top:10px"><div class="label">'+esc(data.people[0])+' ↔ '+esc(data.people[1]||'Partner')+'</div><div class="balance">'+(net(data.people[0])>=0?'+':'−')+euro(Math.abs(net(data.people[0])))+'</div><div class="hint">'+esc(sentence())+'</div></div><div class="section">Azioni rapide</div><div class="quick"><button onclick="openExpense()">➕<br><b>Nuova spesa</b></button><button onclick="openIncome()">💰<br><b>Nuova entrata</b></button><button onclick="openPayment()">💸<br><b>Registra pagamento</b></button><button onclick="go(\'moves\')">📋<br><b>Storico</b></button></div><div class="section">Ultime spese</div><div class="card">'+(r.length?r.map(expRow).join(''):'<div class="empty">Nessuna spesa. Premi Nuova spesa.</div>')+'</div></div>'}
function moves(){var a=data.expenses.slice().sort(function(x,y){return y.date.localeCompare(x.date)});if(moveWho!=='all')a=a.filter(function(e){return e.paidBy===moveWho});if(moveCat!=='all')a=a.filter(function(e){return e.category===moveCat});return'<div class="content"><div class="row"><div class="section">Movimenti</div><button class="btn secondary" onclick="openExpense()">＋ Spesa</button></div><div class="filterbar"><button class="'+(moveWho==='all'?'sel':'')+'" onclick="setMoveWho(\'all\')">Tutti</button>'+data.people.map(function(p){return'<button class="'+(moveWho===p?'sel':'')+'" onclick="setMoveWho(\''+esc(p)+'\')">'+esc(p)+'</button>'}).join('')+'</div><div class="filterbar"><button class="'+(moveCat==='all'?'sel':'')+'" onclick="setMoveCat(\'all\')">Tutte le categorie</button>'+data.categories.map(function(cat){return'<button class="'+(moveCat===cat?'sel':'')+'" onclick="setMoveCat(\''+esc(cat)+'\')">'+esc(cat)+'</button>'}).join('')+'</div><div class="card">'+(a.length?a.map(expRow).join(''):'<div class="empty">Nessun movimento con questi filtri.</div>')+'</div></div>'}
function chart(){var now=new Date(),from=new Date(now.getFullYear(),0,1);if(chartPeriod==='3m')from=new Date(now.getFullYear(),now.getMonth()-2,1);if(chartPeriod==='6m')from=new Date(now.getFullYear(),now.getMonth()-5,1);if(chartPeriod==='all')from=new Date(2000,0,1);var ex=data.expenses.filter(function(e){var d=new Date(e.date+'T12:00:00');return d>=from&&d<=now&&(chartWho==='all'||e.paidBy===chartWho)&&(chartCat==='all'||e.category===chartCat)}),inc=data.incomes.filter(function(e){var d=new Date(e.date+'T12:00:00');return d>=from&&d<=now}),months=[];var count=chartPeriod==='3m'?3:chartPeriod==='6m'?6:12;for(var i=0;i<count;i++){var d=chartPeriod==='year'?new Date(now.getFullYear(),i,1):new Date(now.getFullYear(),now.getMonth()-count+1+i,1);months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:d.toLocaleDateString('it-IT',{month:'short',year:'2-digit'})})}var points=months.map(function(m){return{month:m.label,expenses:ex.filter(function(e){return e.date.slice(0,7)===m.key}).reduce(function(a,e){return a+e.amount},0),income:inc.filter(function(e){return e.date.slice(0,7)===m.key}).reduce(function(a,e){return a+e.amount},0)}}),cats=data.categories.map(function(cat){return{key:cat,total:ex.filter(function(e){return e.category===cat}).reduce(function(a,e){return a+e.amount},0)}}).filter(function(x){return x.total>0}).sort(function(a,b){return b.total-a.total});return'<div class="content"><div class="section">Grafico spese ed entrate</div><div class="filterbar"><button class="'+(chartPeriod==='3m'?'sel':'')+'" onclick="setChartPeriod(\'3m\')">3 mesi</button><button class="'+(chartPeriod==='6m'?'sel':'')+'" onclick="setChartPeriod(\'6m\')">6 mesi</button><button class="'+(chartPeriod==='year'?'sel':'')+'" onclick="setChartPeriod(\'year\')">Quest’anno</button><button class="'+(chartPeriod==='all'?'sel':'')+'" onclick="setChartPeriod(\'all\')">Tutto</button></div><div class="filterbar"><button class="'+(chartWho==='all'?'sel':'')+'" onclick="setChartWho(\'all\')">Tutti</button>'+data.people.map(function(p){return'<button class="'+(chartWho===p?'sel':'')+'" onclick="setChartWho(\''+esc(p)+'\')">'+esc(p)+'</button>'}).join('')+'</div><div class="filterbar"><button class="'+(chartCat==='all'?'sel':'')+'" onclick="setChartCat(\'all\')">Tutte le categorie</button>'+data.categories.map(function(cat){return'<button class="'+(chartCat===cat?'sel':'')+'" onclick="setChartCat(\''+esc(cat)+'\')">'+esc(cat)+'</button>'}).join('')+'</div><div class="card chart"><div class="label">Andamento nel tempo</div><div class="linechart"><div class="linegrid"></div><div class="chartLegend"><span><i class="incomeDot"></i>Entrate</span><span><i class="expenseDot"></i>Spese</span></div><svg class="lineSvg mainSvg" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="incomeLine" points="'+points.map(function(p,i){var max=Math.max(1,...points.map(function(x){return Math.max(x.income,x.expenses)}));return((count===1?0:i/(count-1))*100)+','+(96-(p.income/max*84))}).join(' ')+'"/><polyline class="expenseLine" points="'+points.map(function(p,i){var max=Math.max(1,...points.map(function(x){return Math.max(x.income,x.expenses)}));return((count===1?0:i/(count-1))*100)+','+(96-(p.expenses/max*84))}).join(' ')+'"/>'+points.map(function(p,i){var max=Math.max(1,...points.map(function(x){return Math.max(x.income,x.expenses)}));var x=(count===1?0:i/(count-1))*100;return'<circle class="incomePoint" cx="'+x+'" cy="'+(96-(p.income/max*84))+'" r="1.5"/><circle class="expensePoint" cx="'+x+'" cy="'+(96-(p.expenses/max*84))+'" r="1.5"/>'}).join('')+'</svg><div class="lineLabels">'+points.map(function(p){return'<span>'+esc(p.month)+'</span>'}).join('')+'</div></div></div><div class="section">Spese per categoria</div><div class="card">'+(cats.length?cats.map(function(x){return'<div class="catbar"><div class="row"><span>'+esc(x.key)+'</span><b>'+euro(x.total)+'</b></div><div class="bartrack"><div class="barfill" style="width:'+Math.max(3,Math.round(x.total/(cats[0].total||1)*100))+'%"></div></div></div>'}).join(''):'<div class="empty">Nessuna spesa nel periodo.</div>')+'</div></div>'}function balance(){var a=data.people[0],b=data.people[1],n=net(a);return'<div class="content"><div class="card"><div class="label">'+esc(a)+' ↔ '+esc(b)+'</div><div class="balance">'+(n>=0?'+':'−')+euro(Math.abs(n))+'</div><div class="hint">'+esc(sentence())+'</div><button class="btn primary full" style="margin-top:12px" onclick="openPayment()">💸 Registra pagamento</button></div><div class="section">Dettaglio spese condivise</div><div class="card">'+data.expenses.filter(function(e){return e.participants.indexOf(a)>=0&&e.participants.indexOf(b)>=0}).map(function(e){return'<div class="expense"><div class="row"><b>'+esc(e.desc)+'</b><b>'+euro(e.amount)+'</b></div><div class="meta">'+esc(e.paidBy)+' ha pagato · quota '+esc(a)+': '+euro(share(e,a))+' · quota '+esc(b)+': '+euro(share(e,b))+'</div></div>'}).join('')+'</div></div>'}
function more(){return'<div class="content"><div class="section">Impostazioni</div><div class="card"><div class="row"><span><b>'+esc(data.people[0])+'</b><br><span class="meta">Soggetto principale</span></span><button class="btn secondary" onclick="openPeople()">Modifica</button></div><div class="row" style="margin-top:14px"><span><b>'+esc(data.people[1])+'</b><br><span class="meta">Persona condivisa</span></span><button class="btn secondary" onclick="openPeople()">Modifica</button></div></div><div class="section">Categorie</div><div class="card"><div class="row"><span><b>'+esc(data.people[0])+'</b><br><span class="meta">Persona principale</span></span><button class="btn secondary" onclick="openPeople()">Modifica</button></div><div class="row" style="margin-top:14px"><span><b>'+esc(data.people[1])+'</b><br><span class="meta">Persona condivisa</span></span><button class="btn secondary" onclick="openPeople()">Modifica</button></div></div><div class="section">Categorie</div><div class="card">'+data.categories.map(function(c){return'<span style="display:inline-block;padding:5px 8px;margin:3px;border-radius:20px;background:#edf2ef;font-size:11px">'+esc(c)+'</span>'}).join('')+'</div></div>'}
function modalShell(t,b){return'<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>'+t+'</h2>'+b+'</div></div>'}
function expenseModal(){payer=data.people[0];split='equal';return modalShell('Nuova spesa','<div class="form"><div class="field"><label>Importo</label><input id="ea" type="number" step="0.01" min="0" placeholder="0,00"></div><div class="field"><label>Descrizione</label><input id="ed" placeholder="Es. Supermercato"></div><div class="field"><label>Categoria</label><select id="ec">'+data.categories.map(function(c){return'<option>'+esc(c)+'</option>'}).join('')+'</select></div><div class="field"><label>Data</label><input id="edate" type="date" value="'+today()+'"></div><div class="field"><label>Pagata da</label><div class="choices">'+data.people.map(function(p,i){return'<button class="'+(i===0?'sel':'')+'" data-p="'+esc(p)+'">👤 '+esc(p)+'</button>'}).join('')+'</div></div><div class="field"><label>Divisa tra</label><div class="checks">'+data.people.map(function(p){return'<label class="sel"><input type="checkbox" value="'+esc(p)+'" checked> '+esc(p)+'</label>'}).join('')+'</div></div><div class="field"><label>Divisione</label><div class="choices"><button id="eq" class="sel" onclick="setSplit(\'equal\')">Quote uguali</button><button id="cu" onclick="setSplit(\'custom\')">Quote personalizzate</button></div></div><div id="shares"></div><div class="field"><label>Note</label><input id="en" placeholder="Opzionale"></div><button class="btn primary full" onclick="saveExpense()">Salva spesa</button></div>')}
function incomeModal(){return modalShell('Nuova entrata','<div class="form"><div class="field"><label>Importo</label><input id="ia" type="number" step="0.01"></div><div class="field"><label>Descrizione</label><input id="id" placeholder="Es. Stipendio"></div><div class="field"><label>Data</label><input id="idt" type="date" value="'+today()+'"></div><button class="btn primary full" onclick="saveIncome()">Salva entrata</button></div>')}
function paymentModal(){paymentFrom=data.people[1];return modalShell('Registra pagamento','<div class="form"><div class="field"><label>Chi paga?</label><div class="choices"><button id="pf" class="sel" onclick="chooseFrom(\''+esc(data.people[1])+'\')">'+esc(data.people[1])+'</button><button id="pt" onclick="chooseFrom(\''+esc(data.people[0])+'\')">'+esc(data.people[0])+'</button></div></div><div class="field"><label>Importo</label><input id="pa" type="number" step="0.01"></div><div class="field"><label>Data</label><input id="pdt" type="date" value="'+today()+'"></div><div class="field"><label>Descrizione</label><input id="pd" placeholder="Es. Bonifico"></div><button class="btn primary full" onclick="savePayment()">Registra pagamento</button></div>')}
function peopleModal(){return modalShell('Persone','<div class="form"><div class="field"><label>Persona principale</label><input id="p1" value="'+esc(data.people[0])+'"></div><div class="field"><label>Persona condivisa</label><input id="p2" value="'+esc(data.people[1])+'"></div><button class="btn primary full" onclick="savePeople()">Salva</button></div>')}
function setMoveWho(x){moveWho=x;render()}function setMoveCat(x){moveCat=x;render()}function setChartPeriod(x){chartPeriod=x;render()}function setChartWho(x){chartWho=x;render()}function setChartCat(x){chartCat=x;render()}function modalHtml(){if(modal==='expense')return expenseModal();if(modal==='income')return incomeModal();if(modal==='payment')return paymentModal();return peopleModal()}
function render(){document.getElementById('root').innerHTML='<div class="app">'+top()+(view==='home'?home():view==='moves'?moves():view==='chart'?chart():more())+nav()+(modal?modalHtml():'')+'</div>';bind()}
function bind(){document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){payer=b.getAttribute('data-p');document.querySelectorAll('[data-p]').forEach(function(x){x.classList.toggle('sel',x===b)})}});document.querySelectorAll('.checks input').forEach(function(x){x.onchange=function(){x.parentElement.classList.toggle('sel',x.checked)}})}
function openExpense(){modal='expense';render()}function openIncome(){modal='income';render()}function openPayment(){modal='payment';render()}function openPeople(){modal='people';render()}function closeModal(){modal=null;render()}function go(v){view=v;render()}
function setSplit(m){split=m;document.getElementById('eq').classList.toggle('sel',m==='equal');document.getElementById('cu').classList.toggle('sel',m==='custom');if(m==='custom'){var ps=[].slice.call(document.querySelectorAll('.checks input:checked')).map(function(x){return x.value});document.getElementById('shares').innerHTML=ps.map(function(p){return'<div class="field"><label>Quota '+esc(p)+'</label><input class="share" data-person="'+esc(p)+'" type="number" step="0.01"></div>'}).join('')}else document.getElementById('shares').innerHTML=''}
function saveExpense(){var amount=Number(document.getElementById('ea').value),ps=[].slice.call(document.querySelectorAll('.checks input:checked')).map(function(x){return x.value});if(!amount||!ps.length)return alert('Inserisci importo e partecipanti.');var shares={};if(split==='equal')ps.forEach(function(p){shares[p]=amount/ps.length});else document.querySelectorAll('.share').forEach(function(x){shares[x.dataset.person]=Number(x.value||0)});var sum=Object.values(shares).reduce(function(a,x){return a+x},0);if(Math.abs(sum-amount)>.01)return alert('Le quote devono sommare '+euro(amount));data.expenses.unshift({id:Date.now(),amount:amount,date:document.getElementById('edate').value,desc:document.getElementById('ed').value,category:document.getElementById('ec').value,paidBy:payer,insertedBy:data.people[0],participants:ps,split:split,shares:shares,note:document.getElementById('en').value});save();closeModal()}
function saveIncome(){var a=Number(document.getElementById('ia').value);if(!a)return alert('Inserisci un importo.');data.incomes.unshift({id:Date.now(),amount:a,date:document.getElementById('idt').value,desc:document.getElementById('id').value||'Entrata'});localStorage.setItem(KEY,JSON.stringify(data));modal=null;render()}
function chooseFrom(p){paymentFrom=p;document.getElementById('pf').classList.toggle('sel',p===data.people[1]);document.getElementById('pt').classList.toggle('sel',p===data.people[0])}
function savePayment(){var a=Number(document.getElementById('pa').value);if(!a)return alert('Inserisci un importo.');var to=paymentFrom===data.people[0]?data.people[1]:data.people[0];data.payments.unshift({id:Date.now(),amount:a,date:document.getElementById('pdt').value,desc:document.getElementById('pd').value,from:paymentFrom,to:to});save();closeModal()}
function savePeople(){var a=document.getElementById('p1').value.trim(),b=document.getElementById('p2').value.trim();if(!a||!b)return alert('Inserisci entrambi i nomi.');data.people=[a,b];save();closeModal()}
function delExp(id){if(confirm('Eliminare la spesa?')){data.expenses=data.expenses.filter(function(e){return e.id!==id});save()}}
window.openExpense=openExpense;window.openIncome=openIncome;window.openPayment=openPayment;window.openPeople=openPeople;window.closeModal=closeModal;window.go=go;window.setMoveWho=setMoveWho;window.setMoveCat=setMoveCat;window.setChartPeriod=setChartPeriod;window.setChartWho=setChartWho;window.setChartCat=setChartCat;window.setSplit=setSplit;window.saveExpense=saveExpense;window.saveIncome=saveIncome;window.savePayment=savePayment;window.chooseFrom=chooseFrom;window.savePeople=savePeople;window.delExp=delExp;
try{render()}catch(e){document.getElementById('root').innerHTML='<div style="padding:24px;font-family:system-ui"><h2>Errore nell\'app</h2><p>La pagina è stata caricata ma i dati locali non sono compatibili.</p><button onclick="localStorage.removeItem(\'spese_condivise_v2\');location.reload()" style="padding:12px 16px;border:0;border-radius:10px;background:#173f35;color:#fff;font-weight:700">Ripristina app</button></div>'}
})();</script></body></html>
