common:['Utenze','Spesa alimentare','Casa','Mutuo','Altro'],

function euro(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function total(){return visibleExpenses().reduce(function(a,e){return a+e.amount},0)}
function paid(p){return visibleExpenses().filter(function(e){return e.paidBy===p}).reduce(function(a,e){return a+e.amount},0)}
function share(e,p){if(e.participants.indexOf(p)<0)return 0;if(e.split==='equal')return e.amount/e.participants.length;return Number((e.shares||{})[p]||0)}
function isCommonExpense(e){
  if(!e||!e.participants)return false;
  return data.people.length>=2 &&
    e.participants.indexOf(data.people[0])>=0 &&
    e.participants.indexOf(data.people[1])>=0;
}
function isVisibleExpense(e){
  if(!currentMember)return true;
  var me=currentMember.name||'';
  return isCommonExpense(e)||e.participants.indexOf(me)>=0;
}
function visibleExpenses(){
  return data.expenses.filter(isVisibleExpense);
}

function net(p){var common=data.expenses.filter(isCommonExpense);var x=common.filter(function(e){return e.paidBy===p}).reduce(function(a,e){return a+e.amount},0)-common.reduce(function(a,e){return a+share(e,p)},0);data.payments.forEach(function(q){if(q.to===p)x-=q.amount;if(q.from===p)x+=q.amount});return x}
function sentence(){var a=data.people[0],b=data.people[1],n=net(a);if(!b)return'Configura una seconda persona.';if(Math.abs(n)<.005)return'Siete in pari.';return n>0?b+' deve '+euro(n)+' a '+a:a+' deve '+euro(-n)+' a '+b}

function top(){return'<div class="top"><div class="brand">Gestore delle Spese</div><div class="sub">Chi ha pagato · chi deve cosa · saldi</div></div>'}
function expRow(e){return'<div class="expense row"><div><div class="title">'+esc(e.desc||'Spesa')+'</div><div class="meta">'+fmtDate(e.date)+' · pagata da <b>'+esc(e.paidBy)+'</b></div><div class="meta">Divisa tra '+e.participants.map(esc).join(', ')+'</div></div><div style="text-align:right"><div class="amount neg">−'+euro(e.amount)+'</div><button class="danger" onclick="delExp('+e.id+')">Elimina</button></div></div>'}
function home(){
var me=currentMember?currentMember.name:data.people[0],
    ve=visibleExpenses(),
    common=ve.filter(isCommonExpense),
    personal=ve.filter(function(e){
      return !isCommonExpense(e) && e.participants.indexOf(me)>=0;
    }),
    paidEnrico=common.filter(function(e){return e.paidBy===data.people[0]}).reduce(function(a,e){return a+e.amount},0),
    paidClaudia=common.filter(function(e){return e.paidBy===data.people[1]}).reduce(function(a,e){return a+e.amount},0),
    totalCommon=common.reduce(function(a,e){return a+e.amount},0),
    totalPersonal=personal.reduce(function(a,e){return a+e.amount},0),
    r=ve.slice(0,6);

return'<div class="content">'+
'<div class="grid">'+
'<div class="card"><div class="label">Spese comuni</div><div class="value">'+euro(totalCommon)+'</div></div>'+
'<div class="card"><div class="label">Spese personali</div><div class="value">'+euro(totalPersonal)+'</div><div class="meta" style="margin-top:4px">'+esc(me)+'</div></div>'+
'<div class="card"><div class="label">Pagato da '+esc(data.people[0])+'</div><div class="value">'+euro(paidEnrico)+'</div><div class="meta" style="margin-top:4px">spese comuni</div></div>'+
'<div class="card"><div class="label">Pagato da '+esc(data.people[1])+'</div><div class="value">'+euro(paidClaudia)+'</div><div class="meta" style="margin-top:4px">spese comuni</div></div>'+
'</div>'+
'<div class="card" style="margin-top:10px"><div class="label">'+esc(data.people[0])+' ↔ '+esc(data.people[1]||'Partner')+'</div><div class="balance">'+(net(data.people[0])>=0?'+':'−')+euro(Math.abs(net(data.people[0])))+'</div><div class="hint">'+esc(sentence())+'</div></div>'+
'<div class="section">Azioni rapide</div><div class="quick"><button onclick="openExpense()"><span class="quickico quickadd">＋</span><b>Nuova spesa</b></button><button onclick="openIncome()"><span class="quickico">💰</span><b>Nuova entrata</b></button><button onclick="openPayment()"><span class="quickico">💸</span><b>Registra pagamento</b></button><button onclick="go(\'moves\')"><span class="quickico">📋</span><b>Storico</b></button></div>'+
'<div class="section">Ultime spese</div><div class="card">'+(r.length?r.map(expRow).join(''):'<div class="empty">Nessuna spesa. Premi Nuova spesa.</div>')+'</div></div>'
}
function incomeRow(i){return'<div class="expense row"><div><div class="title">💰 '+esc(i.desc||'Entrata')+'</div><div class="meta">'+fmtDate(i.date)+' · entrata di <b>'+esc(i.member||'')+'</b></div></div><div style="text-align:right"><div class="amount pos">+'+euro(i.amount)+'</div><button class="danger" onclick="delIncome('+i.id+')">Elimina</button></div></div>'}
function paymentRow(p){return'<div class="expense row"><div><div class="title">💸 '+esc(p.desc||'Pagamento')+'</div><div class="meta">'+fmtDate(p.date)+' · '+esc(p.from)+' → '+esc(p.to)+'</div></div><div style="text-align:right"><div class="amount">−'+euro(p.amount)+'</div></div></div>'}
function periodRange(kind,year,part,start,end){
var y=Number(year)||new Date().getFullYear(),s,e;
if(kind==='month'){var m=Number(part)||new Date().getMonth()+1;s=new Date(y,m-1,1);e=new Date(y,m,0,23,59,59)}
else if(kind==='quarter'){var q=Number(part)||1;s=new Date(y,(q-1)*3,1);e=new Date(y,q*3,0,23,59,59)}
else if(kind==='semester'){var h=Number(part)||1;s=new Date(y,(h-1)*6,1);e=new Date(y,h*6,0,23,59,59)}
else if(kind==='year'){s=new Date(y,0,1);e=new Date(y,11,31,23,59,59)}
else{s=new Date(start+'T00:00:00');e=new Date(end+'T23:59:59')}
return{s:s,e:e}
}
function periodControls(prefix,kind,year,part,start,end,setter){
var html='<div class="filterbar"><button class="'+(kind==='month'?'sel':'')+'" onclick="'+setter+"('month')"+'">Mese</button><button class="'+(kind==='quarter'?'sel':'')+'" onclick="'+setter+"('quarter')"+'">Trimestre</button><button class="'+(kind==='semester'?'sel':'')+'" onclick="'+setter+"('semester')"+'">Semestre</button><button class="'+(kind==='year'?'sel':'')+'" onclick="'+setter+"('year')"+'">Anno</button><button class="'+(kind==='custom'?'sel':'')+'" onclick="'+setter+"('custom')"+'">Personalizzato</button></div>';
if(kind==='month')html+='<div class="filterbar"><select class="periodSelect" onchange="'+setter+"Part(this.value)"+'">'+['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'].map(function(n,i){return'<option value="'+(i+1)+'" '+(Number(part)===i+1?'selected':'')+'>'+n+'</option>'}).join('')+'</select>'+yearSelect(year,setter+'Year')+'</div>';
if(kind==='quarter')html+='<div class="filterbar"><select class="periodSelect" onchange="'+setter+"Part(this.value)"+'"><option value="1" '+(Number(part)===1?'selected':'')+'>Gennaio – Marzo</option><option value="2" '+(Number(part)===2?'selected':'')+'>Aprile – Giugno</option><option value="3" '+(Number(part)===3?'selected':'')+'>Luglio – Settembre</option><option value="4" '+(Number(part)===4?'selected':'')+'>Ottobre – Dicembre</option></select>'+yearSelect(year,setter+'Year')+'</div>';
if(kind==='semester')html+='<div class="filterbar"><select class="periodSelect" onchange="'+setter+"Part(this.value)"+'"><option value="1" '+(Number(part)===1?'selected':'')+'>Gennaio – Giugno</option><option value="2" '+(Number(part)===2?'selected':'')+'>Luglio – Dicembre</option></select>'+yearSelect(year,setter+'Year')+'</div>';
if(kind==='year')html='<div class="filterbar">'+yearSelect(year,setter+'Year')+'</div>';
if(kind==='custom')html='<div class="filterbar"><label class="periodDate">Da <input type="date" value="'+esc(start)+'" onchange="'+setter+"Start(this.value)"+'"></label><label class="periodDate">A <input type="date" value="'+esc(end)+'" onchange="'+setter+"End(this.value)"+'"></label></div>';
return html
}
function yearSelect(year,fn){var y=new Date().getFullYear(),h='<select class="periodSelect" onchange="'+fn+'(this.value)">';for(var i=y-10;i<=y+1;i++)h+='<option value="'+i+'" '+(Number(year)===i?'selected':'')+'>'+i+'</option>';return h+'</select>'}
function moves(){
var a=[],now=new Date(),pr=periodRange(movePeriod,moveYear,movePart,moveStart,moveEnd);
data.expenses.filter(isVisibleExpense).forEach(function(e){a.push({kind:'expense',date:e.date,obj:e})});

a=a.filter(function(x){var d=new Date(x.date+'T12:00:00');return d>=pr.s&&d<=pr.e});
a.sort(function(x,y){return y.date.localeCompare(x.date)});
if(moveWho!=='all')a=a.filter(function(x){return x.kind==='expense'?x.obj.paidBy===moveWho:x.kind==='income'?x.obj.member===moveWho:(x.obj.from===moveWho||x.obj.to===moveWho)});

return'<div class="content"><div class="row"><div class="section">Movimenti</div><button class="btn secondary" onclick="openExpense()">＋ Spesa</button></div><div class="filterTitle">Periodo</div>'+periodControls('move',movePeriod,moveYear,movePart,moveStart,moveEnd,'setMovePeriod')+'<div class="filterTitle">Chi</div><div class="filterbar"><button class="'+(moveWho==='all'?'sel':'')+'" onclick="setMoveWho(\'all\')">Tutti</button>'+data.people.map(function(p){return'<button class="'+(moveWho===p?'sel':'')+'" onclick="setMoveWho(\''+esc(p)+'\')">'+esc(p)+'</button>'}).join('')+'</div><div class="filterbar"><button class="'+(moveCat==='all'?'sel':'')+'" onclick="setMoveCat(\'all\')">Tutte le categorie</button>'+data.categories.map(function(cat){return'<button class="'+(moveCat===cat?'sel':'')+'" onclick="setMoveCat(\''+esc(cat)+'\')">'+esc(cat)+'</button>'}).join('')+'</div><div class="card">'+(a.length?a.map(function(x){return x.kind==='expense'?expRow(x.obj):x.kind==='income'?incomeRow(x.obj):paymentRow(x.obj)}).join(''):'<div class="empty">Nessun movimento con questi filtri.</div>')+'</div></div>'
}
function chart(){
var pr=periodRange(chartPeriod,chartYear,chartPart,chartStart,chartEnd),selected=chartCats.length>0;
var me=currentMember?currentMember.name:'';

var ex=data.expenses.filter(function(e){
  if(!isVisibleExpense(e))return false;
  var d=new Date(e.date+'T12:00:00');
  if(d<pr.s||d>pr.e)return false;
  if(selected&&chartCats.indexOf(e.category)<0)return false;
  return isCommonExpense(e)||(e.participants&&e.participants.indexOf(me)>=0);
});

var inc=data.incomes.filter(function(e){
  if(currentMember&&e.member!==me)return false;
  var d=new Date(e.date+'T12:00:00');
  return d>=pr.s&&d<=pr.e;
});

var months=[],i;
if(chartPeriod==='month'){
  var days=new Date(pr.e.getFullYear(),pr.e.getMonth()+1,0).getDate();
  for(i=1;i<=days;i++)months.push({
    key:pr.s.getFullYear()+'-'+String(pr.s.getMonth()+1).padStart(2,'0')+'-'+String(i).padStart(2,'0'),
    label:String(i)
  });

return '<div class="content"><div class="section">Andamento nel tempo</div><div class="chartHint">'+(selected?'Categorie selezionate':'Entrate e spese personali')+'</div><div class="filterTitle">Periodo</div>'+periodControls('chart',chartPeriod,chartYear,chartPart,chartStart,chartEnd,'setChartPeriod')+'<div class="filterTitle">Tipo di spesa</div><div class="filterbar"><button class="'+(chartExpenseMode==='both'?'sel':'')+'" onclick="setChartExpenseMode(\'both\')">Entrambe</button><button class="'+(chartExpenseMode==='common'?'sel':'')+'" onclick="setChartExpenseMode(\'common\')">50% spese comuni</button><button class="'+(chartExpenseMode==='personal'?'sel':'')+'" onclick="setChartExpenseMode(\'personal\')">Spese personali</button></div>'+'<div class="filterTitle">Categorie <span class="hintText">'+(selected?'Seleziona più categorie':'Nessuna selezionata = Entrate/Uscite')+'</span></div><div class="filterbar"><button class="'+(!selected?'sel':'')+'" onclick="setChartCat(\'all\')">Entrate / Uscite</button>'+data.categories.map(function(cat,i){return'<button class="'+(chartCats.indexOf(cat)>=0?'sel':'')+'" onclick="setChartCatByIndex('+i+')">'+esc(cat)+'</button>'}).join('')+'</div><div class="card chart"><div class="label">'+(selected?'Confronto tra categorie':'Entrate e spese nel periodo')+'</div><div class="linechart" style="padding-left:38px"><div class="linegrid"></div><div class="axisLabels" style="position:absolute;left:0;top:12px;bottom:28px;width:34px">'+axisLabels+'</div><div class="chartLegend">'+legend+'</div><svg class="lineSvg mainSvg" viewBox="0 0 100 100" preserveAspectRatio="none">'+lines+dots+'</svg><div class="lineLabels">'+points.map(function(p){return'<span>'+esc(p.month)+'</span>'}).join('')+'</div></div></div>'+(selected?'<div class="section">Totale categorie selezionate</div><div class="card">'+cats.sort(function(a,b){return b.total-a.total}).map(function(z){return'<div class="catbar"><div class="row"><span>'+esc(z.key)+'</span><b>'+euro(z.total async function login(){
if(authBusy)return;
var email=(document.getElementById('loginEmail')||{}).value||'',password=(document.getElementById('loginPassword')||{}).value||'';
if(!email||!password){authError='Inserisci email e password.';render();return}
authBusy=true;authError='';render();

async function logout(){await supabaseClient.auth.signOut();currentUser=null;currentMember=null;authError='';render()}
async function syncFromServer(){
if(!currentMember)return;
var h=currentMember.household_id;
var results=await Promise.all([
supabaseClient.from('members').select('id,name,household_id').eq('household_id',h).order('id'),
supabaseClient.from('categories').select('id,name,active').eq('household_id',h).eq('active',true).order('id'),
supabaseClient.from('expenses').select('id,amount,description,category_id,date,paid_by_member_id,inserted_by_user_id,split_type,note').eq('household_id',h).order('date',{ascending:false}),
supabaseClient.from('expense_shares').select('id,expense_id,member_id,amount').order('id'),
supabaseClient.from('payments').select('id,household_id,from_member_id,to_member_id,amount,date,note').eq('household_id',h).order('date',{ascending:false}),
supabaseClient.from('incomes').select('id,household_id,member_id,amount,date,description').eq('household_id',h).order('date',{ascending:false})
]);
var bad=results.find(function(r){return r.error});if(bad)throw bad.error;
var members=results[0].data||[],cats=results[1].data||[],exs=results[2].data||[],shares=results[3].data||[],pays=results[4].data||[],incs=results[5].data||[];
var byId={};members.forEach(function(m){byId[m.id]=m.name});
var catById={};cats.forEach(function(x){catById[x.id]=x.name});
var sharesBy={};shares.forEach(function(s){(sharesBy[s.expense_id]||(sharesBy[s.expense_id]=[])).push(s)});
data.people=members.map(function(m){return m.name});
if(data.people.length<2)data.people=['Enrico','Claudia'];
data.categories=cats.map(function(x){return x.name});
data.expenses=exs.map(function(e){
var ss=sharesBy[e.id]||[], participants=ss.map(function(s){return byId[s.member_id]}).filter(Boolean), sh={};
ss.forEach(function(s){sh[byId[s.member_id]]=Number(s.amount)});
return{id:e.id,amount:Number(e.amount),date:e.date,desc:e.description,category:catById[e.category_id]||'Altro',paidBy:byId[e.paid_by_member_id]||'',insertedBy:currentUser.id,participants:participants,split:e.split_type,shares:sh,note:e.note||''}
});
data.payments=pays.map(function(p){return{id:p.id,amount:Number(p.amount),date:p.date,desc:p.note||'Pagamento',from:byId[p.from_member_id]||'',to:byId[p.to_member_id]||''}});
data.incomes=incs.map(function(i){return{id:i.id,amount:Number(i.amount),date:i.date,desc:i.description,member:byId[i.member_id]||''}});
localStorage.setItem(KEY,JSON.stringify(data));
}
async function loadAuthUser(){
var s=await supabaseClient.auth.getSession();
currentUser=s.data.session?s.data.session.user:null;
if(!currentUser){authReady=true;render();return}
var r=await supabaseClient.from('members').select('id,name,household_id').eq('user_id',currentUser.id).maybeSingle();
if(r.error){authError='Accesso riuscito, ma non riesco a leggere il profilo.';currentMember=null}
else{

try{await syncFromServer();authError=''}catch(e){authError='Accesso riuscito, ma non riesco a sincronizzare i dati.'}

}

async function saveExpense(){
var amount=Number(document.getElementById('ea').value),ps=[].slice.call(document.querySelectorAll('.checks input:checked')).map(function(x){return x.value});
if(!amount||!ps.length)return alert('Inserisci importo e partecipanti.');
var shares={};if(split==='equal')ps.forEach(function(p){shares[p]=amount/ps.length});else document.querySelectorAll('.share').forEach(function(x){shares[x.dataset.person]=Number(x.value||0)});
var sum=Object.values(shares).reduce(function(a,x){return a+x},0);if(Math.abs(sum-amount)>.01)return alert('Le quote devono sommare '+euro(amount));
if(!currentMember)return alert('Profilo non sincronizzato.');
var catName=document.getElementById('ec').value,cat=await supabaseClient.from('categories').select('id').eq('household_id',currentMember.household_id).eq('name',catName).maybeSingle();
if(cat.error||!cat.data)return alert('Categoria non disponibile sul server.');
var paidMember=(await supabaseClient.from('members').select('id').eq('household_id',currentMember.household_id).eq('name',payer).maybeSingle());
if(paidMember.error||!paidMember.data)return alert('Persona non disponibile sul server.');
var ins=await supabaseClient.from('expenses').insert({household_id:currentMember.household_id,amount:amount,description:document.getElementById('ed').value||'Spesa',category_id:cat.data.id,date:document.getElementById('edate').value,paid_by_member_id:paidMember.data.id,inserted_by_user_id:currentUser.id,split_type:split,note:document.getElementById('en').value||null}).select('id').single();
if(ins.error)return alert('Errore nel salvataggio online: '+ins.error.message);
var rows=ps.map(function(p){return{expense_id:ins.data.id,member_id:null,amount:shares[p]}});
var mems=await supabaseClient.from('members').select('id,name').eq('household_id',currentMember.household_id);
if(mems.error)return alert('Spesa salvata, ma non riesco a leggere i partecipanti.');
rows.forEach(function(r){var m=mems.data.find(function(x){return x.name===ps[rows.indexOf(r)]});if(m)r.member_id=m.id});
if(rows.some(function(r){return !r.member_id})){await supabaseClient.from('expenses').delete().eq('id',ins.data.id);return alert('Partecipante non disponibile sul server.');}
var sr=await supabaseClient.from('expense_shares').insert(rows);
if(sr.error){await supabaseClient.from('expenses').delete().eq('id',ins.data.id);return alert('Errore nel salvataggio delle quote: '+sr.error.message);}
await syncFromServer();modal=null;render();
}
async function saveIncome(){
var a=Number(document.getElementById('ia').value);if(!a)return alert('Inserisci un importo.');if(!currentMember)return alert('Profilo non sincronizzato.');
var r=await supabaseClient.from('incomes').insert({household_id:currentMember.household_id,member_id:currentMember.id,amount:a,date:document.getElementById('idt').value,description:document.getElementById('id').value||'Entrata'});

document.body.appendChild(box);

};
}
