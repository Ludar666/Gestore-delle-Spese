function share(e,p){if(e.participants.indexOf(p)<0)return 0;if(e.split==='equal')return e.amount/e.participants.length;return Number((e.shares||{})[p]||0)}
function isCommonExpense(e){
  if(!e||!e.participants)return false;

    e.participants.indexOf(data.people[0])>=0 &&

function periodRange(kind,year,part,start,end){
var y=Number(year)||new Date().getFullYear(),s,e;
if(kind==='month'){var m=Number(part)||new Date().getMonth()+1;s=new Date(y,m-1,1);e=new Date(y,m,0,23,59,59)}
else if(kind==='quarter'){var q=Number(part)||1;s=new Date(y,(q-1)*3,1);e=new Date(y,q*3,0,23,59,59)}
else if(kind==='semester'){var h=Number(part)||1;s=new Date(y,(h-1)*6,1);e=new Date(y,h*6,0,23,59,59)}
else if(kind==='year'){s=new Date(y,0,1);e=new Date(y,11,31,23,59,59)}

}

function chart(){
var pr=periodRange(chartPeriod,chartYear,chartPart,chartStart,chartEnd);
var me=currentMember?currentMember.name:'';

var ex=data.expenses.filter(function(e){
  if(!isVisibleExpense(e))return false;
  var d=new Date(e.date+'T12:00:00');
  return d>=pr.s&&d<=pr.e;
});

var inc=data.incomes.filter(function(e){
  if(currentMember&&e.member!==me)return false;
  var d=new Date(e.date+'T12:00:00');
  return d>=pr.s&&d<=pr.e;
});

function expenseValue(e){
  var common=isCommonExpense(e);
  if(chartExpenseMode==='common')return common?e.amount/2:0;
  if(chartExpenseMode==='personal')return common?0:e.amount;
  return common?e.amount/2:e.amount;
}

var totalIncome=inc.reduce(function(a,e){return a+e.amount},0);

var cats=data.categories.map(function(cat){
  var total=ex.filter(function(e){
    return e.category===cat;
  }).reduce(function(a,e){
    return a+expenseValue(e);
  },0);
  return {key:cat,total:total};
}).filter(function(x){
  return x.total>0;
}).sort(function(a,b){
  return b.total-a.total;
});

var totalExpense=cats.reduce(function(a,x){return a+x.total},0);

var palette=[
  '#2878d0','#d34b4b','#2e9d61','#9b59b6',
  '#e67e22','#16a085','#34495e','#c0392b',
  '#8e44ad','#2980b9','#27ae60','#f39c12',
  '#7f8c8d','#d35400','#2c3e50','#1abc9c'
];

var offset=0;
var donutSegments=cats.map(function(x,i){
  var pct=totalExpense?x.total/totalExpense*100:0;
  var color=palette[i%palette.length];
  var segment='<circle cx="110" cy="110" r="76" fill="none" stroke="'+color+'" stroke-width="30" stroke-dasharray="'+pct+' '+(100-pct)+'" stroke-dashoffset="-'+offset+'" pathLength="100" transform="rotate(-90 110 110)"/>';
  offset+=pct;
  return segment;
}).join('');

var legend=cats.map(function(x,i){

}).join('');

var donut=totalExpense
  ?'<div style="width:230px;height:230px;max-width:100%;margin:4px auto 18px;position:relative"><svg viewBox="0 0 220 220" width="230" height="230" style="display:block;max-width:100%">'+donutSegments+'</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none"><div class="meta">Uscite</div><b style="font-size:24px">'+euro(totalExpense)+'</b></div></div>'
  :'<div style="text-align:center;padding:45px 10px;color:var(--muted)">Nessuna spesa nel periodo selezionato.</div>';

return '<div class="content"><div class="section">Grafico</div><div class="chartHint">Ripartizione delle uscite per categoria</div><div class="filterTitle">Periodo</div>'+periodControls('chart',chartPeriod,chartYear,chartPart,chartStart,chartEnd,'setChartPeriod')+'<div class="filterTitle">Tipo di spesa</div><div class="filterbar"><button class="'+(chartExpenseMode==='both'?'sel':'')+'" onclick="setChartExpenseMode(\'both\')">Entrambe</button><button class="'+(chartExpenseMode==='common'?'sel':'')+'" onclick="setChartExpenseMode(\'common\')">50% spese comuni</button><button class="'+(chartExpenseMode==='personal'?'sel':'')+'" onclick="setChartExpenseMode(\'personal\')">Spese personali</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0"><div class="card" style="margin:0;text-align:center;padding:14px 8px"><div class="meta">Entrate</div><b style="font-size:20px">'+euro(totalIncome)+'</b></div><div class="card" style="margin:0;text-align:center;padding:14px 8px"><div class="meta">Uscite</div><b style="font-size:20px">'+euro(totalExpense)+'</b></div></div><div class="card chart"><div class="label">Spese per categoria</div>'+donut+'<div>'+legend+'</div></div></div>';
}

function setExpenseType(t){
 expenseType=t;
 var isCommon=t==='common';
 var personIndex=t==='personal1'?1:0;
 var oldCat=document.getElementById('ec')?document.getElementById('ec').value:null;
 var cats=data.categories.filter(function(c){
  return isCommon?categoryGroup(c)==='common':(categoryGroup(c)==='personal'||c==='Altro');
 });
 var ec=document.getElementById('ec');
 if(ec){
  ec.innerHTML=cats.map(function(c){
   return '<option'+(c===oldCat?' selected':'')+'>'+esc(c)+'</option>';
  }).join('');
 }
 payer=isCommon?(data.people.indexOf(payer)>=0?payer:data.people[0]):data.people[personIndex];
 document.getElementById('typeCommon').classList.toggle('sel',t==='common');
 document.getElementById('typeEnrico').classList.toggle('sel',t==='personal0');
 document.getElementById('typeClaudia').classList.toggle('sel',t==='personal1');
 document.querySelectorAll('[data-p]').forEach(function(b){
  b.classList.toggle('sel',b.getAttribute('data-p')===payer);
 });
 document.querySelectorAll('.checks input').forEach(function(x){
  x.checked=isCommon?data.people.indexOf(x.value)>=0:x.value===payer;
  x.parentElement.classList.toggle('sel',x.checked);
 });
 split='equal';
 document.getElementById('eq').classList.add('sel');
 document.getElementById('cu').classList.remove('sel');
 document.getElementById('shares').innerHTML='';
}

async function login(){

async function syncFromServer(){
if(!currentMember)return;
var h=currentMember.household_id;
var results=await Promise.all([
supabaseClient.from('members').select('id,name,household_id').eq('household_id',h).order('id'),
supabaseClient.from('categories').select('id,name,active').eq('household_id',h).eq('active',true).order('id'),
supabaseClient.from('expenses').select('id,amount,description,category_id,date,paid_by_member_id,inserted_by_user_id,split_type,note').eq('household_id',h).order('date',{ascending:false}),
supabaseClient.from('expense_shares').select('id,expense_id,member_id,amount').order('id'),
supabaseClient.from('payments').select('id,household_id,from_member_id,to_member_id,amount,date,note').eq('household_id',h).order('date',{ascending:false}),
supabaseClient.from('incomes').select('id,household_id,member_id,amount,date,description').eq('household_id',h).order('date',{ascending:false})
]);
var bad=results.find(function(r){return r.error});if(bad)throw bad.error;
var members=results[0].data||[],cats=results[1].data||[],exs=results[2].data||[],shares=results[3].data||[],pays=results[4].data||[],incs=results[5].data||[];
var byId={};members.forEach(function(m){byId[m.id]=m.name});
var catById={};cats.forEach(function(x){catById[x.id]=x.name});
var sharesBy={};shares.forEach(function(s){(sharesBy[s.expense_id]||(sharesBy[s.expense_id]=[])).push(s)});
data.people=members.map(function(m){return m.name});
if(data.people.length<2)data.people=['Enrico','Claudia'];
data.categories=cats.map(function(x){return x.name});
data.expenses=exs.map(function(e){
var ss=sharesBy[e.id]||[], participants=ss.map(function(s){return byId[s.member_id]}).filter(Boolean), sh={};
ss.forEach(function(s){sh[byId[s.member_id]]=Number(s.amount)});
return{id:e.id,amount:Number(e.amount),date:e.date,desc:e.description,category:catById[e.category_id]||'Altro',paidBy:byId[e.paid_by_member_id]||'',insertedBy:currentUser.id,participants:participants,split:e.split_type,shares:sh,note:e.note||''}
});
data.payments=pays.map(function(p){return{id:p.id,amount:Number(p.amount),date:p.date,desc:p.note||'Pagamento',from:byId[p.from_member_id]||'',to:byId[p.to_member_id]||''}});
data.incomes=incs.map(function(i){return{id:i.id,amount:Number(i.amount),date:i.date,desc:i.description,member:byId[i.member_id]||''}});
localStorage.setItem(KEY,JSON.stringify(data));
}

async function saveExpense(){
var amount=Number(document.getElementById('ea').value);
var ps=[].slice.call(document.querySelectorAll('.checks input:checked')).map(function(x){return x.value});
var editId=editingExpenseId;
if(!Number.isFinite(amount)||amount<=0||!ps.length)return alert('Inserisci un importo valido e almeno un partecipante.');
if(!payer||ps.indexOf(payer)<0&&expenseType!=='common')return alert('Controlla il pagante e i partecipanti.');
var shares={};
if(split==='equal'){ps.forEach(function(p){shares[p]=amount/ps.length})}
else{
var shareInputs=[].slice.call(document.querySelectorAll('.share'));
var shareNames=shareInputs.map(function(x){return x.dataset.person});
if(shareNames.length!==ps.length||ps.some(function(p){return shareNames.indexOf(p)<0})||shareNames.some(function(p){return ps.indexOf(p)<0}))return alert('Le quote non corrispondono esattamente ai partecipanti selezionati. Seleziona nuovamente Quote personalizzate e reinserisci le quote.');
shareInputs.forEach(function(x){shares[x.dataset.person]=Number(x.value===''?NaN:x.value)});
}
var sum=ps.reduce(function(a,p){return a+(shares[p]||0)},0);
if(ps.some(function(p){return !Number.isFinite(shares[p])||shares[p]<0})||Math.abs(sum-amount)>.01)return alert('Le quote devono sommare '+euro(amount)+' e non possono essere negative.');
if(!currentMember||!currentUser)return alert('Profilo non sincronizzato.');
var catName=document.getElementById('ec').value;
var cat=await supabaseClient.from('categories').select('id').eq('household_id',currentMember.household_id).eq('name',catName).maybeSingle();
if(cat.error||!cat.data)return alert('Categoria non disponibile sul server.');
var paidMember=await supabaseClient.from('members').select('id').eq('household_id',currentMember.household_id).eq('name',payer).maybeSingle();
if(paidMember.error||!paidMember.data)return alert('Persona non disponibile sul server.');
var mems=await supabaseClient.from('members').select('id,name').eq('household_id',currentMember.household_id);
if(mems.error)return alert('Non riesco a verificare i partecipanti sul server.');
var memberByName={};
(mems.data||[]).forEach(function(m){memberByName[m.name]=m.id});
if(ps.some(function(p){return !memberByName[p]}))return alert('Uno dei partecipanti non è disponibile sul server.');
var payload={household_id:currentMember.household_id,amount:amount,description:document.getElementById('ed').value||'Spesa',category_id:cat.data.id,date:document.getElementById('edate').value,paid_by_member_id:paidMember.data.id,split_type:split,note:document.getElementById('en').value||null};
var oldShares=[];
if(editId!==null){
var old=await supabaseClient.from('expense_shares').select('member_id,amount').eq('expense_id',editId);
if(old.error)return alert('Non riesco a leggere le quote precedenti: '+old.error.message);
oldShares=(old.data||[]).map(function(x){return{expense_id:editId,member_id:x.member_id,amount:Number(x.amount)}});
var upd=await supabaseClient.from('expenses').update({amount:payload.amount,description:payload.description,category_id:payload.category_id,date:payload.date,paid_by_member_id:payload.paid_by_member_id,split_type:payload.split_type,note:payload.note}).eq('id',editId).eq('household_id',currentMember.household_id).select('id').maybeSingle();
if(upd.error)return alert('Errore nella modifica della spesa: '+upd.error.message);
if(!upd.data)return alert('Spesa non trovata o non modificabile.');
var del=await supabaseClient.from('expense_shares').delete().eq('expense_id',editId);
if(del.error)return alert('La spesa è stata aggiornata, ma non sono riuscito a sostituire le quote: '+del.error.message);
var newRows=ps.map(function(p){return{expense_id:editId,member_id:memberByName[p],amount:shares[p]}});
var sr=await supabaseClient.from('expense_shares').insert(newRows);
if(sr.error){
var cleanup=await supabaseClient.from('expense_shares').delete().eq('expense_id',editId);
var restored=null;
if(!cleanup.error)restored=await supabaseClient.from('expense_shares').insert(oldShares);
if(cleanup.error||!restored||restored.error)return alert('La spesa è stata aggiornata, ma il salvataggio delle quote è fallito e il ripristino delle quote precedenti non è riuscito. Verifica la spesa prima di modificarla ancora. Dettaglio: '+sr.error.message);
return alert('Le quote nuove non sono state salvate. Ho ripristinato le quote precedenti. Dettaglio: '+sr.error.message);
}
}else if(document.getElementById('erec')&&document.getElementById('erec').value!=='none'){
var recurrenceFrequency=document.getElementById('erec').value;

var recurringShares=ps.map(function(p){return{member_id:memberByName[p],amount:shares[p]}});
var recurringResult=await supabaseClient.rpc('create_recurring_expense_with_first_occurrence',{p_household_id:payload.household_id,p_amount:payload.amount,p_description:payload.description,p_category_id:payload.category_id,p_paid_by_member_id:payload.paid_by_member_id,p_split_type:payload.split_type,p_note:payload.note,p_start_date:payload.date,p_end_date:null,p_frequency:recurrenceFrequency,p_shares:recurringShares});
if(recurringResult.error)return alert('Errore nel salvataggio della spesa ricorrente: '+recurringResult.error.message);
}else{
var ins=await supabaseClient.from('expenses').insert({household_id:payload.household_id,amount:payload.amount,description:payload.description,category_id:payload.category_id,date:payload.date,paid_by_member_id:payload.paid_by_member_id,inserted_by_user_id:currentUser.id,split_type:payload.split_type,note:payload.note}).select('id').single();
if(ins.error)return alert('Errore nel salvataggio online: '+ins.error.message);
var rows=ps.map(function(p){return{expense_id:ins.data.id,member_id:memberByName[p],amount:shares[p]}});
var sr=await supabaseClient.from('expense_shares').insert(rows);
if(sr.error){await supabaseClient.from('expenses').delete().eq('id',ins.data.id).eq('household_id',currentMember.household_id);return alert('Errore nel salvataggio delle quote: '+sr.error.message);}
}
await syncFromServer();
editingExpenseId=null;
modal=null;
render();
}
